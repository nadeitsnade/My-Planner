<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="retro-header">
  <div class="badge">🕹️</div>
  <div class="grow"><h1>MY PLANNER</h1><div id="clock" class="clock"></div></div>
  <div class="badge">⭐</div>
</header>

<div class="tabs">
  <button class="tab active" data-page="home">Home</button>
  <button class="tab" data-page="schedule">Schedule</button>
  <button class="tab" data-page="notes">Notes</button>
  <button class="tab" data-page="todo">To-do</button>
  <button class="tab" data-page="money">Money</button>
</div>

<div id="page-home" class="page">
  <div class="card c-green"><h2 id="today"></h2></div>
  <div class="card c-yellow"><h3>Up next</h3><div id="next"></div></div>
  <div class="card c-blue"><h3>Progress</h3><div id="stats"></div></div>
  <div class="card" id="moodCard">
    <h3>⚡ Spent this month</h3>
    <div id="moodFace" class="face">😎</div>
    <div id="moodTotal" class="total"></div>
    <div id="moodMsg"></div>
    <div class="sub">Top 3 drains</div>
    <div id="topCats"></div>
  </div>
</div>

<div id="page-schedule" class="page hidden">
  <div class="card">
    <div class="cal-head">
      <button id="calPrev" class="small-btn">‹</button>
      <h3 id="calTitle"></h3>
      <button id="calNext" class="small-btn">›</button>
    </div>
    <div id="calGrid" class="cal-grid"></div>
    <div class="note">! = to do. Warmer color = closer date. Tap a day to open it.</div>
  </div>
  <div id="dayPanel" class="card hidden"></div>
  <div class="form">
    <input id="taskTitle" placeholder="Title">
    <input id="taskDue" type="datetime-local">
    <textarea id="taskNotes" placeholder="Notes"></textarea>
    <button id="addTask">Add</button>
  </div>
  <div id="list"></div>
</div>

<div id="page-notes" class="page hidden">
  <div class="section-header">
    <h2>📌 NOTES</h2>
    <button class="retro-btn" id="openNote">+ Add Note</button>
  </div>
  <div id="noteList" class="note-grid"></div>
  <div id="noteModal" class="modal hidden">
    <div class="modal-box">
      <h3 id="noteModalTitle">New Note</h3>
      <input id="noteTitle" placeholder="Note title...">
      <textarea id="noteText" placeholder="Write your thoughts here..."></textarea>
      <div class="modal-buttons">
        <button id="saveNote" class="retro-btn">Save</button>
        <button id="closeNote" class="retro-btn secondary">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="page-todo" class="page hidden">
  <div class="form">
    <input id="todoText" placeholder="New to-do">
    <button id="addTodo">Add</button>
  </div>
  <div id="todoList"></div>
</div>

<div id="page-money" class="page hidden">
  <div class="card c-green"><h3>Wallet</h3><div id="balanceBox"></div></div>
  <div class="card c-blue"><h3>This month</h3><div id="moneySummary"></div></div>
  <div class="card c-yellow"><h3>Loans</h3><div id="loanSummary"></div></div>
  <div class="form" id="moneyForm">
    <input id="moneyTitle" placeholder="What for?">
    <input id="moneyAmount" type="number" inputmode="decimal" placeholder="Amount in VND">
    <div class="pay-btn-group">
      <button type="button" class="pay-option active" data-value="cash">💵 Cash</button>
      <button type="button" class="pay-option" data-value="cashless">💳 Card</button>
      <button type="button" class="pay-option" data-value="loan">🤝 Loan</button>
    </div>
    <input type="hidden" id="moneyPay" value="cash">
      <div id="loanDir" class="pay-btn-group hidden">
  <button type="button" class="dir-option active" data-value="lent">➡️ I lent</button>
  <button type="button" class="dir-option" data-value="borrowed">⬅️ I borrowed</button>
</div>
<input type="hidden" id="moneyDir" value="lent">
    <input id="moneyPerson" class="hidden" placeholder="Loan to who? (name)">
    <select id="moneyType">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <select id="moneyCat">
      <option>Food</option><option>Transport</option><option>Shopping</option>
      <option>Bills</option><option>Fun</option><option>Salary</option>
      <option>Gift</option><option>Other</option>
    </select>
    <label class="photo-pick">📷 Add picture
  <input type="file" id="moneyPhoto" accept="image/*">
</label>
<div id="photoPreview"></div>
    <input id="moneyDate" type="date">
    <button id="addMoney">Add</button>
    <button id="cancelMoney" class="hidden">Cancel edit</button>
  </div>
  <div id="moneyList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
